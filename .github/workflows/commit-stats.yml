name: update-commit-stats

# 每日刷新主页 README 的「最近 90 天提交」徽章数字
# 放置位置：QWQcool/QWQcool 仓库 -> .github/workflows/commit-stats.yml
# 前置条件：QWQcool/QWQcool 的 README.md 中已包含一行徽章（数字与日期区间写任意现值即可）
#   [![Commits 90d](https://img.shields.io/badge/Commits_90d-<数字>-2f6fb2)](https://github.com/QWQcool?tab=overview&from=YYYY-MM-DD&to=YYYY-MM-DD)
# 每天 09:00 (UTC+8) 自动刷新「数字」与「链接里的统计区间」，也可在 Actions 页手动 Run workflow。
#
# 统计口径提醒：GitHub 的 search/commits 只索引「默认分支」上的提交，且 total_count 上限 1000，
# 所以这里是 90 天内默认分支提交数（跨仓库），涨到 1000 附近就会撞顶不再增长。

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 09:00 北京时间
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count commits in last 90 days
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '90 days ago' +%Y-%m-%d)
          total=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "search/commits?q=author:QWQcool+committer-date:%3E${since}&per_page=1" \
            --jq '.total_count')
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "since=${since}" >> "$GITHUB_OUTPUT"
          echo "近 90 天 commit 数: ${total} (since ${since})"

      - name: Refresh badge number in README
        env:
          TOTAL: ${{ steps.count.outputs.total }}
          SINCE: ${{ steps.count.outputs.since }}
        run: |
          # 取到的数字必须是纯数字，否则后面会把徽章写坏
          if ! [[ "${TOTAL}" =~ ^[0-9]+$ ]]; then
            echo "::error::提交数获取失败（TOTAL='${TOTAL}'）"
            exit 1
          fi
          today=$(date -u +%Y-%m-%d)
          # 匹配「已有数字」而不是一次性占位符 UPDATE_ME：
          # 旧写法在首次运行后占位符就消失，此后每天 sed 都匹配不到，永远走「无变化，跳过提交」。
          sed -i -E "s/Commits_90d-[0-9]+/Commits_90d-${TOTAL}/" README.md
          # 同步推进徽章链接里的统计区间，避免点进去永远是首次部署时那段日期
          sed -i -E "s/from=[0-9]{4}-[0-9]{2}-[0-9]{2}&to=[0-9]{4}-[0-9]{2}-[0-9]{2}/from=${SINCE}\&to=${today}/" README.md
          grep -o "Commits_90d-[0-9]*" README.md | head -1
          # 守卫：没写进去就显式失败，不再返回「假成功」
          if ! grep -q "Commits_90d-${TOTAL}" README.md; then
            echo "::error::README 徽章数字未被更新（期望 Commits_90d-${TOTAL}），请检查 README 徽章行格式"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "QWQcool"
          git config user.email "1330494624@qq.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: refresh 90-day commit count badge"
            git push
          fi
